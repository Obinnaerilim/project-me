:root{color-scheme:dark;--bg:#0A0B0D;--panel:#14161A;--panel2:#1C1F25;--line:#23262C;--line2:#2A2E35;--text:#F2F2EE;--muted:#8C919A;--dim:#5E636C;--accent:#D7FF3F;--ink:#0A0B0D;--danger:#FF8A8A;--warn:#FFD18A;--display:'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;--body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;--safe-b:env(safe-area-inset-bottom,0px);--tabbar:64px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 var(--body);position:relative;min-height:100vh;isolation:isolate}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:10px;min-height:44px;padding:0 16px;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--ink)}
button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line2)}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line2)}
button.danger{background:transparent;color:var(--danger);border:1px solid #4a2a30}
button.small{min-height:36px;padding:0 12px;font-size:14px}
button:disabled{opacity:.45;cursor:default}
button:active{transform:scale(.98)}
.iconbtn{width:44px;height:44px;min-height:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;background:transparent;color:var(--muted);border:0}
.iconbtn.danger{border:0}
input,select,textarea{width:100%;min-width:0;min-height:48px;background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:16px}
textarea{resize:vertical}
input::placeholder,textarea::placeholder{color:#6B717B}
input[type=range]{padding:0;min-height:32px;accent-color:var(--accent)}
input[type=checkbox]{width:auto;min-height:0}
label{display:block;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
a{color:var(--accent)}
code{font-size:13px}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;margin:0}

#topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 20px;background:rgba(10,11,13,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
#topbar .mark{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.18em;text-transform:uppercase}
#subnav{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 0;max-width:760px;margin:auto}
.pill-btn{min-height:40px;padding:0 16px;border-radius:99px;background:transparent;color:var(--muted);border:1px solid var(--line2);font-size:14px;white-space:nowrap}
.pill-btn.active{background:var(--accent);color:var(--ink);border-color:var(--accent)}
main{max-width:760px;margin:auto;padding:16px 16px calc(var(--tabbar) + var(--safe-b) + 40px)}
body.has-dock main{padding-bottom:calc(var(--tabbar) + var(--safe-b) + 120px)}
footer{text-align:center;color:var(--dim);padding:28px 0 8px;font-size:12px}

#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;height:calc(var(--tabbar) + var(--safe-b));padding:4px 8px var(--safe-b);background:rgba(10,11,13,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
#tabbar button{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;background:transparent;color:var(--muted);border-radius:0;font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.08em}
#tabbar button.active{color:var(--accent)}
#tabbar svg{width:24px;height:24px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:22px;letter-spacing:.04em;margin:0 0 12px}
.card h3{font-size:18px;letter-spacing:.04em;margin:0 0 8px}
.card .card{background:transparent;border:0;padding:0;margin:0}
.muted{color:var(--muted)}.small{font-size:13px}.dim{color:var(--dim)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.metric{font-family:var(--display);font-weight:700;font-size:32px;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.metric small{font-size:18px;color:var(--muted);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.spacer{height:14px}.hidden{display:none!important}
.history{padding:12px 0;border-top:1px solid var(--line)}
.history:first-child{border-top:0}
.empty{padding:22px;text-align:center;color:var(--muted)}
.tag{font-size:12px;color:var(--accent);letter-spacing:.06em}
.field-help{font-size:13px;color:var(--muted);margin-top:6px}
.badge{display:inline-block;background:var(--accent);color:var(--ink);font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.1em;padding:2px 8px;border-radius:6px;margin-left:6px;vertical-align:middle}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.chip svg{width:14px;height:14px;flex-shrink:0}
.warnchip{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--muted);padding:2px 0}
.warnchip svg{width:15px;height:15px;margin-top:2px;flex-shrink:0;color:var(--warn)}
.warnchip details{width:100%}.warnchip summary{cursor:pointer;list-style:none}.warnchip summary::-webkit-details-marker{display:none}
.bar{height:8px;border-radius:8px;background:var(--panel2);overflow:hidden}
.bar>div{height:100%;background:var(--accent);border-radius:8px}
.bar.over>div{background:var(--danger)}
.back{display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--muted);padding:0 4px;min-height:44px;margin-bottom:4px;font-family:var(--body);text-transform:none;letter-spacing:0;font-size:15px;font-weight:600}
.back svg{width:18px;height:18px}

/* overview */
.hero{padding:6px 0 18px}
.hero .big{font-family:var(--display);font-weight:800;font-size:clamp(64px,22vw,96px);line-height:.9;letter-spacing:-.01em;text-transform:uppercase;margin-top:10px}
.hero .sub{font-size:16px;color:var(--muted);margin-top:10px}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;margin-top:20px;border-radius:10px;background:var(--accent);color:var(--ink);font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.1em;text-transform:uppercase}
.cta svg{width:20px;height:20px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;justify-items:center}
.week .d{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--muted)}
.week .dot{width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center}
.week .dot.done{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.week .dot.today{border:2px solid var(--accent)}
.week .dot.today::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.week .dot svg{width:18px;height:18px}
.rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ringbox{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.ring{position:relative;width:88px;height:88px}
.ring svg{width:88px;height:88px}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:26px}
.ringbox .l{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.ringbox .v{font-size:13px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.wrow{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:16px}
.spark{width:96px;height:32px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.sec-h b{font-family:var(--display);font-size:15px;letter-spacing:.06em}

/* workouts */
.daypills{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px}
.wk-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.wk-head .big{font-family:var(--display);font-weight:800;font-size:clamp(44px,14vw,60px);line-height:.9;text-transform:uppercase}
.wk-head .cnt{font-family:var(--display);font-weight:700;font-size:40px;line-height:.9;text-align:right;font-variant-numeric:tabular-nums}
.wk-head .cnt span{color:var(--dim)}
.ex{border-bottom:1px solid var(--line)}
.exh{width:100%;min-height:68px;display:flex;align-items:center;gap:14px;padding:10px 4px;background:transparent;color:var(--text);border:0;border-radius:0;text-align:left;font-family:var(--body);text-transform:none;letter-spacing:0;font-size:17px;font-weight:600}
.exh .n{width:26px;flex-shrink:0;font-family:var(--display);font-weight:700;font-size:26px;color:var(--dim)}
.exh .t{flex:1;min-width:0}
.exh .t small{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-top:2px}
.exh .p{font-family:var(--display);font-weight:700;font-size:17px;color:var(--muted)}
.exh .ok{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--ink);display:flex;align-items:center;justify-content:center}
.exh .ok svg{width:14px;height:14px}
.exh .chev{width:18px;height:18px;color:var(--muted);transition:transform .15s}
.ex.open .chev{transform:rotate(180deg)}
.exb{padding:0 4px 18px 40px;display:flex;flex-direction:column;gap:10px}
.setrow{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) 48px;gap:10px;align-items:center}
.setrow .sn{font-family:var(--display);font-weight:700;font-size:20px;color:var(--muted);text-align:center}
.setrow input{height:48px;text-align:center;font-family:var(--display);font-weight:700;font-size:22px;padding:0 6px}
.setrow.hd{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center}
.chk{width:48px;min-height:48px;height:48px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:10px;border:1.5px solid var(--line2);background:transparent;color:var(--line2)}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.chk svg{width:22px;height:22px}
.exmeta{display:grid;grid-template-columns:1fr 2fr;gap:10px}

/* heatmap */
.hm{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:4px}
.hm i{display:block;aspect-ratio:1;border-radius:4px;background:var(--panel2)}
.hm i.on{background:var(--accent)}
.hm i.fut{opacity:.35}

.chart{width:100%;height:auto;display:block}
.photo-grid,.theme-photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.photo-card img{width:100%;height:180px;object-fit:cover;border-radius:10px;background:var(--panel2)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.compare img{width:100%;max-height:300px;object-fit:contain;background:var(--panel2);border-radius:10px}
.theme-photo{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--panel2)}
.theme-photo img{width:100%;height:145px;object-fit:cover;display:block}
.theme-photo .details{padding:10px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:44px;height:44px;min-height:44px;padding:0;border-radius:50%;border:2px solid var(--line2)}
.swatch.on{border-color:var(--text);box-shadow:0 0 0 2px var(--bg) inset}

details.menu{position:relative}
details.menu summary{list-style:none;cursor:pointer;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--muted);border-radius:10px}
details.menu summary::-webkit-details-marker{display:none}
details.menu .pop{position:absolute;right:0;top:44px;z-index:10;min-width:160px;display:flex;flex-direction:column;gap:6px;padding:8px;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
details.menu .pop button{width:100%;justify-content:flex-start}
.gitem{display:flex;align-items:center;gap:10px}
.gitem .chk{flex-shrink:0}
.moreitem{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:60px;padding:0 4px;background:transparent;color:var(--text);border:0;border-top:1px solid var(--line);border-radius:0;font-family:var(--body);text-transform:none;letter-spacing:0;font-size:17px;font-weight:600}
.moreitem:first-child{border-top:0}
.moreitem svg{width:18px;height:18px;color:var(--muted)}

/* rest dock */
#restDock{position:fixed;left:12px;right:12px;bottom:calc(var(--tabbar) + var(--safe-b) + 8px);z-index:45;max-width:520px;margin:auto;display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--panel2);border:1px solid var(--line2);border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
#restDock.finished{border-color:var(--accent);animation:flash .9s ease-in-out 4}
@keyframes flash{50%{background:#2a3314}}
#restDock .rr{position:relative;width:44px;height:44px;flex-shrink:0}
#restDock .grow{flex:1;min-width:0}
#restDock .nm{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#restClock{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
#restDock button{min-width:48px;min-height:44px;padding:0 8px;font-size:18px;background:var(--bg);color:var(--text);border:1px solid var(--line2)}
#restDock button.x{background:transparent;border:0;color:var(--muted);font-family:var(--body);font-size:13px;text-transform:none;letter-spacing:0}

#toast{position:fixed;left:50%;bottom:calc(var(--tabbar) + var(--safe-b) + 14px);transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:120;max-width:min(92vw,440px);padding:12px 16px;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;font-size:15px;box-shadow:0 12px 30px rgba(0,0,0,.5);transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0)}
body.has-dock #toast{bottom:calc(var(--tabbar) + var(--safe-b) + 90px)}

#sheet{position:fixed;inset:0;z-index:100;display:none}
#sheet.open{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:auto;max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-bottom:0;border-radius:18px 18px 0 0;padding:20px 20px calc(20px + var(--safe-b))}
.sheet h3{font-size:24px;margin-bottom:14px}
.sheet .fld{margin-bottom:12px}
.sheet .actions{margin-top:18px;justify-content:flex-end}
.sheet .actions button{flex:1}

/* backgrounds */
#heroBg{position:absolute;top:0;left:0;right:0;height:320px;z-index:-1;background-image:var(--theme-image,none);background-size:cover;background-position:center 25%;opacity:.36;-webkit-mask-image:linear-gradient(#000 25%,transparent);mask-image:linear-gradient(#000 25%,transparent);pointer-events:none;display:none}
#heroBg.on{display:block}
body.theme-full::before{content:"";position:fixed;inset:0;z-index:-2;background-image:var(--theme-image,none);background-size:cover;background-position:center;pointer-events:none}
body.theme-full::after{content:"";position:fixed;inset:0;z-index:-1;background:rgba(4,8,14,var(--theme-darkness,.72));pointer-events:none}
body.theme-full .card{background:rgba(20,22,26,.84);backdrop-filter:blur(9px)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(min-width:760px){#subnav{padding-left:16px}}
@media(max-width:380px){.setrow{gap:6px}}

.iconbtn svg{width:22px;height:22px}
details.menu summary svg{width:22px;height:22px}
.exh .chev svg{width:100%;height:100%}
svg{flex-shrink:0}

.daypills .pill-btn.active{background:var(--text);color:var(--ink);border-color:var(--text)}
.pill-btn{background:rgba(10,11,13,.55)}

</style></head>

const BUILTIN_MARCUS_SEEDS=[{"id":"marcus-studio","src":"builtin:studio","caption":"Marcus · Studio portrait","section":"home"},{"id":"marcus-boxing","src":"builtin:boxing","caption":"Marcus · Boxing editorial","section":"workouts"},{"id":"marcus-outdoor","src":"builtin:outdoor","caption":"Marcus · Outdoor training","section":"activity"},{"id":"marcus-gym","src":"builtin:gym","caption":"Marcus · Gym training","section":"progress"},{"id":"marcus-fashion","src":"builtin:fashion","caption":"Marcus · Fashion editorial","section":"journal"}];

/* ---------- image store (IndexedDB) ---------- */
const IMG={db:null,ok:false,cache:{}};
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open('project_me_images',1);r.onupgradeneeded=()=>r.result.createObjectStore('img');r.onsuccess=()=>{IMG.db=r.result;IMG.ok=true;res(true)};r.onerror=()=>res(false);r.onblocked=()=>res(false)}catch(e){res(false)}})}
function idbTx(mode,fn){return new Promise((res,rej)=>{if(!IMG.db)return rej(new Error('Image store unavailable'));const tx=IMG.db.transaction('img',mode);const rq=fn(tx.objectStore('img'));tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}
const idbPut=(id,v)=>idbTx('readwrite',s=>s.put(v,id));
const idbDel=id=>idbTx('readwrite',s=>s.delete(id));
function idbLoadAll(){return new Promise(res=>{if(!IMG.db)return res();try{const out={};const rq=IMG.db.transaction('img','readonly').objectStore('img').openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){out[c.key]=c.value;c.continue()}else{Object.assign(IMG.cache,out);res()}};rq.onerror=()=>res()}catch(e){res()}})}
function imgSrc(src){
  if(typeof src!=='string')return '';
  if(src.startsWith('builtin:'))return BUILTIN_MARCUS_IMAGES[src.slice(8)]||'';
  if(src.startsWith('idb:'))return IMG.cache[src.slice(4)]||'';
  return src;
}
const themeImageSrc=imgSrc;
async function storeImage(id,dataUrl){
  if(IMG.ok){try{await idbPut(id,dataUrl);IMG.cache[id]=dataUrl;return 'idb:'+id}catch(e){}}
  return dataUrl;
}
function forgetImage(src){if(typeof src==='string'&&src.startsWith('idb:')){const id=src.slice(4);delete IMG.cache[id];idbDel(id).catch(()=>{})}}
async function resizeImage(file,max,quality){
  const url=URL.createObjectURL(file);
  try{
    const img=new Image();
    await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error('Unsupported image'));img.src=url});
    const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',quality);
  }finally{URL.revokeObjectURL(url)}
}
async function migrateImages(){
  let changed=false;
  for(const x of [...data.photos,...data.themeImages]){
    if(typeof x.src==='string'&&x.src.startsWith('data:')){
      const s=await storeImage(x.id,x.src);
      if(s.startsWith('idb:')){x.src=s;changed=true}
    }
  }
  if(changed)save();
}

/* ---------- data ---------- */
let data,recovered=false;
function loadData(){
  let raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}
  let parsed=null;
  if(raw){
    try{parsed=JSON.parse(raw);if(!parsed||!Array.isArray(parsed.program)||!Array.isArray(parsed.logs))throw new Error('bad shape')}
    catch(e){parsed=null;recovered=true;try{localStorage.setItem(KEY+'_corrupt_'+Date.now(),raw)}catch(e2){}}
  }
  data=parsed||initial();
  normalize();
}
function normalize(){
  data.skills||=[];data.photos||=[];data.ideas||=[];data.journal||=[];data.themeImages||=[];data.weights||=[];data.meals||=[];data.logs||=[];
  data.grocery||={monthlyBudget:300,items:[],purchases:[],pantry:[]};
  data.activity||={goal:10000,entries:[]};
  data.inspiration||={quotes:[],images:[]};
  data.nutrition||={calories:2600,protein:180,carbs:300,fat:75};
  data.theme||={preset:'hero',darkness:72,enabled:true,rotate:false,assignments:{},accent:'#D7FF3F'};
  if(!data.themeV9){data.theme.preset=data.theme.preset==='minimal'?'minimal':'hero';data.theme.accent='#D7FF3F';data.themeV9=true}
  data.unit||='kg';
  if(data.sound===undefined)data.sound=true;
  if(!data.marcusPhotoPackInitialized){
    const have=new Set(data.themeImages.map(x=>x.id));
    for(const p of BUILTIN_MARCUS_SEEDS)if(!have.has(p.id))data.themeImages.push({...p});
    data.marcusPhotoPackInitialized=true;
  }
  data.version=VERSION;
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(data));return true}
  catch(e){toast('Browser storage is full or blocked. Export a backup now.',4500);return false}
}

/* ---------- toast & sheets ---------- */
function toast(msg,ms){
  const t=$('#toast');if(!t)return;
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),ms||2600);
}
let sheetCb=null;
function openSheet(title,body,buttons){
  $('#sheet').innerHTML=`<div class="sheet-bg" onclick="closeSheet()"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3><div>${body}</div><div class="actions">${buttons}</div></div>`;
  $('#sheet').classList.add('open');
  const f=$('#sheet input,#sheet select,#sheet textarea');if(f&&f.type!=='date')f.focus();
}
function closeSheet(){$('#sheet').classList.remove('open');$('#sheet').innerHTML='';sheetCb=null}
function askConfirm(msg,onYes,okLabel){
  sheetCb=onYes;
  openSheet('Are you sure?',`<p>${esc(msg)}</p>`,`<button class="secondary" onclick="closeSheet()">Cancel</button><button class="danger" onclick="sheetYes()">${esc(okLabel||'Delete')}</button>`);
}
function sheetYes(){const cb=sheetCb;closeSheet();if(cb)cb()}
function openForm(title,fields,onSubmit,submitLabel){
  sheetCb=onSubmit;
  const body=fields.map(f=>{
    let el;
    if(f.type==='select')el=`<select data-f="${f.k}">${f.options.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(f.value)?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
    else if(f.type==='textarea')el=`<textarea data-f="${f.k}" rows="4">${esc(f.value??'')}</textarea>`;
    else el=`<input data-f="${f.k}" type="${f.type||'text'}" ${f.type==='number'?'inputmode="decimal" step="any"':''} value="${esc(f.value??'')}" ${f.placeholder?`placeholder="${esc(f.placeholder)}"`:''}>`;

/* ---------- charts ---------- */
function chart(points,key,title,opts){
  opts=opts||{};
  const p=points.slice(-30).filter(x=>Number.isFinite(Number(x[key])));
  if(p.length<2)return `<div class="empty">Add at least two measurements to see your ${esc(title)} trend.</div>`;
  const vals=p.map(x=>Number(x[key]));let lo=Math.min(...vals),hi=Math.max(...vals);
  if(hi===lo){hi+=1;lo-=1}const pad=(hi-lo)*0.12;lo-=pad;hi+=pad;
  const W=600,H=250,L=58,R=18,T=18,B=38,n=p.length;
  const X=i=>L+i*(W-L-R)/(n-1),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const id='g'+Math.random().toString(36).slice(2,8);
  let grid='';
  for(let k=0;k<=3;k++){const v=lo+(hi-lo)*k/3,y=Y(v);grid+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#23262C"/><text x="${L-8}" y="${y+4}" text-anchor="end" fill="#8C919A" font-size="19">${v.toFixed(opts.dec??1)}</text>`}
  const pts=p.map((x,i)=>`${X(i).toFixed(1)},${Y(Number(x[key])).toFixed(1)}`);
  const area=`${L},${H-B} ${pts.join(' ')} ${X(n-1).toFixed(1)},${H-B}`;
  const lab=i=>String(p[i].date||'').slice(5);
  const mid=Math.floor((n-1)/2);
  let avg='';
  if(opts.avg&&n>=3){
    const a=p.map((x,i)=>{const s=p.slice(Math.max(0,i-opts.avg+1),i+1).map(y=>Number(y[key]));return `${X(i).toFixed(1)},${Y(s.reduce((u,v)=>u+v,0)/s.length).toFixed(1)}`});
    avg=`<polyline points="${a.join(' ')}" fill="none" style="stroke:#F2F2EE" stroke-opacity=".55" stroke-width="2" stroke-dasharray="5 5"/>`;
  }
  const dots=p.map((x,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(Number(x[key])).toFixed(1)}" r="${i===n-1?6:3}" style="fill:var(--accent)"><title>${esc(x.date||'')}: ${Number(x[key]).toFixed(opts.dec??1)}${esc(opts.unit||'')}</title></circle>`).join('');
  const last=Number(p[n-1][key]);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)} trend"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent)" stop-opacity=".32"/><stop offset="1" style="stop-color:var(--accent)" stop-opacity="0"/></linearGradient></defs>${grid}<polygon points="${area}" fill="url(#${id})"/>${avg}<polyline points="${pts.join(' ')}" fill="none" style="stroke:var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${dots}<text x="${X(n-1)}" y="${Math.max(12,Y(last)-12)}" text-anchor="end" fill="#F2F2EE" font-size="22" font-weight="700">${last.toFixed(opts.dec??1)}${esc(opts.unit||'')}</text><text x="${L}" y="${H-10}" fill="#8C919A" font-size="19">${esc(lab(0))}</text><text x="${X(mid)}" y="${H-10}" text-anchor="middle" fill="#8C919A" font-size="19">${esc(lab(mid))}</text><text x="${W-R}" y="${H-10}" text-anchor="end" fill="#8C919A" font-size="19">${esc(lab(n-1))}</text></svg>`;
}
function sparkline(values){
  const v=values.filter(Number.isFinite).slice(-20);if(v.length<2)return '';
  let lo=Math.min(...v),hi=Math.max(...v);if(hi===lo){hi++;lo--}
  const pts=v.map((x,i)=>`${(i*(96/(v.length-1))).toFixed(1)},${(30-(x-lo)/(hi-lo)*28).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 96 32" aria-hidden="true"><polyline points="${pts}" fill="none" style="stroke:var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

let audioCtx=null;

function beep(){
  try{
    if(!audioCtx)return;const t0=audioCtx.currentTime;
    [[0,880],[0.25,880],[0.5,1175]].forEach(([d,f])=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t0+d);g.gain.exponentialRampToValueAtTime(0.35,t0+d+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+d+0.2);
      o.connect(g);g.connect(audioCtx.destination);o.start(t0+d);o.stop(t0+d+0.22);
    });
  }catch(e){}
}
const restTimer={active:false,running:false,finished:false,total:0,remaining:0,endAt:0,name:'',exerciseId:null,interval:null};
const fmtClock=s=>{const v=Math.max(0,Math.ceil(s));return Math.floor(v/60)+':'+String(v%60).padStart(2,'0')};
function buildDock(){
  $('#restDock').innerHTML=`<div class="rr"><svg viewBox="0 0 44 44" width="44" height="44" aria-hidden="true"><circle cx="22" cy="22" r="18" fill="none" stroke="#2A2E35" stroke-width="4"/><circle id="restRing" cx="22" cy="22" r="18" fill="none" style="stroke:var(--accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="113.1" stroke-dashoffset="0" transform="rotate(-90 22 22)"/></svg></div><div class="grow"><div class="nm" id="restName"></div><div id="restClock" aria-live="off">0:00</div></div><button aria-label="Subtract 15 seconds" onclick="adjustRest(-15)">−15</button><button aria-label="Add 15 seconds" onclick="adjustRest(15)">+15</button><button class="x" onclick="dismissRest()">Skip</button>`;
  $('#restDock').classList.remove('hidden');document.body.classList.add('has-dock');
}
function updateDock(){
  if(!restTimer.active)return;
  const c=$('#restClock');if(!c)return;
  c.textContent=fmtClock(restTimer.remaining);
  $('#restName').textContent=restTimer.finished?'Rest over — next set':'Rest · '+restTimer.name;
  $('#restRing').setAttribute('stroke-dashoffset',(113.1*(1-Math.min(1,restTimer.remaining/Math.max(1,restTimer.total)))).toFixed(2));
  $('#restDock').classList.toggle('finished',restTimer.finished);
}
function stopRestInterval(){if(restTimer.interval){clearInterval(restTimer.interval);restTimer.interval=null}}
function tickRest(){
  if(restTimer.running){
    restTimer.remaining=Math.max(0,Math.ceil((restTimer.endAt-Date.now())/1000));
    if(restTimer.remaining<=0){
      restTimer.running=false;restTimer.finished=true;stopRestInterval();
      if(data.sound!==false)beep();
      try{if(navigator.vibrate)navigator.vibrate([150,100,150])}catch(e){}
    }
  }
  updateDock();
}
function startRest(id){
  const e=findEx(id);if(!e)return;
  const secs=Math.max(15,Number(e.rest)||defaultRest(e.name));
  unlockAudio();
  Object.assign(restTimer,{active:true,running:true,finished:false,total:secs,remaining:secs,endAt:Date.now()+secs*1000,name:e.name,exerciseId:id});
  buildDock();
  if(!restTimer.interval)restTimer.interval=setInterval(tickRest,250);
  tickRest();
}
function adjustRest(delta){
  if(!restTimer.active)return;
  const base=restTimer.running?Math.ceil((restTimer.endAt-Date.now())/1000):0,next=base+delta;
  if(next<=0){if(restTimer.running){restTimer.endAt=Date.now();tickRest()}return}
  Object.assign(restTimer,{running:true,finished:false,remaining:next,endAt:Date.now()+next*1000,total:Math.max(restTimer.total,next)});
  if(!restTimer.interval)restTimer.interval=setInterval(tickRest,250);
  tickRest();
}
function dismissRest(){
  stopRestInterval();Object.assign(restTimer,{active:false,running:false,finished:false});
  $('#restDock').classList.add('hidden');$('#restDock').innerHTML='';document.body.classList.remove('has-dock');
}

/* ---------- training helpers ---------- */
let day=0,session={},histEx='';
const numw=v=>{const n=parseFloat(String(v??'').replace(',','.'));return Number.isFinite(n)?n:NaN};
const numr=v=>{const n=parseInt(String(v??''),10);return Number.isFinite(n)?n:NaN};
const num2=n=>String(Math.round(n*100)/100);
function curDay(){return data.program[Math.min(day,data.program.length-1)]}
function findEx(id){for(const d of data.program){const e=d.exercises.find(x=>x.id===id);if(e)return e}return null}
function sess(e){
  const s=session[e.id]||(session[e.id]={sets:[],rir:'',notes:''});
  while(s.sets.length<e.sets)s.sets.push({w:'',r:'',done:false});
  return s;
}
function hasProgress(i){

}
function writeDraft(){try{localStorage.setItem(DRAFT_KEY,JSON.stringify({day,session}))}catch(e){}}
function saveDraft(){clearTimeout(saveDraft._t);saveDraft._t=setTimeout(writeDraft,250)}
window.addEventListener('pagehide',()=>{if(saveDraft._t){clearTimeout(saveDraft._t);saveDraft._t=0;writeDraft()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&saveDraft._t){clearTimeout(saveDraft._t);saveDraft._t=0;writeDraft()}});

}
document.addEventListener('input',ev=>{
  const el=ev.target;if(!el||!el.dataset)return;
  if(el.dataset.e){
    const e=findEx(el.dataset.e);if(!e)return;const s=sess(e);
    if(el.dataset.s!==undefined)s.sets[+el.dataset.s][el.dataset.k]=el.value;else s[el.dataset.k]=el.value;

  }else if(el.id==='sessionDate'){session._date=el.value;saveDraft()}
  else if(el.id==='sessionNote'){session._note=el.value;saveDraft()}
});
function entrySets(en){
  if(Array.isArray(en.sets))return en.sets.map(s=>({w:numw(s.w),r:numr(s.r)})).filter(s=>Number.isFinite(s.w)&&Number.isFinite(s.r)&&s.r>0);
  const w=numw(en.weight);if(!Number.isFinite(w))return [];
  return String(en.reps||'').split(/[^0-9]+/).filter(Boolean).map(r=>({w,r:+r})).filter(s=>s.r>0);
}
const e1rm=s=>s.w*(1+s.r/30);
function bestE1rm(name){
  let best=0;
  data.logs.forEach(l=>l.entries.forEach(en=>{if(en.exercise.toLowerCase()===name.toLowerCase())entrySets(en).forEach(s=>{best=Math.max(best,e1rm(s))})}));
  return best;
}
function lastEntry(name){
  for(let i=data.logs.length-1;i>=0;i--){const e=data.logs[i].entries.find(x=>x.exercise.toLowerCase()===name.toLowerCase());if(e)return {log:data.logs[i],e}}
  return null;
}
function entryText(e){
  if(Array.isArray(e.sets)&&e.sets.length)return e.sets.map(s=>`${esc(s.w||'—')}×${esc(s.r||'—')}`).join(' · ')+(e.unit?' '+esc(e.unit):'');
  return `${esc(e.weight||'bodyweight')} · ${esc(e.reps||'—')} reps`;
}
function lastPerformance(name){
  const r=lastEntry(name);if(!r)return 'No previous performance recorded';
  return 'Previous: '+esc(r.log.date)+' · '+entryText(r.e)+(r.e.rir?' · RIR '+esc(r.e.rir):'');
}
function lastTopWeight(name){
  const r=lastEntry(name);if(!r)return '';
  const s=entrySets(r.e);return s.length?num2(Math.max(...s.map(x=>x.w))):'';
}
function suggestNext(ex){
  const r=lastEntry(ex.name);if(!r)return '';
  const sets=entrySets(r.e);if(!sets.length)return '';
  const W=Math.max(...sets.map(s=>s.w)),m=String(ex.reps).match(/(\d+)\s*[–-]\s*(\d+)/);
  const hi=m?+m[2]:Number((String(ex.reps).match(/\d+/)||[0])[0]);
  if(!hi)return '';
  const top=sets.filter(s=>s.w===W),inc=data.unit==='lb'?5:2.5,u=data.unit;

  return `Aim for ${hi} reps at ${num2(W)} ${u}`;
}

  let last=data.logs[0];data.logs.forEach(l=>{if(String(l.date)>=String(last.date))last=l});
  const i=data.program.findIndex(d=>d.name===last.day);
  return i<0?0:(i+1)%data.program.length;
}
function startWorkout(i){day=i;session._open=undefined;setTab('workouts')}

  <section class="card"><div class="wrow" style="border:0;padding:0"><div><div class="eyebrow">Body weight</div><div class="muted small">${lastW?esc(lastW.date):'Baseline · not logged yet'}</div></div>${sparkline(wts.map(x=>Number(x.kg)))}<div class="metric">${lastW?esc(lastW.kg):'86.64'} <small>kg</small></div></div></section>

function exerciseHtml(e,i,open){
  const s=sess(e),done=s.sets.filter(x=>x.done).length,all=s.sets.length,complete=all>0&&done===all;
  const topW=lastTopWeight(e.name),repHint=String(e.reps).split(' ')[0],sug=suggestNext(e);
  const head=`<button class="exh" onclick="toggleOpen('${e.id}')" aria-expanded="${open}"><span class="n">${i+1}</span><span class="t">${esc(e.name)}<small>${e.sets} × ${esc(e.reps)} · ${fmtClock(Number(e.rest)||defaultRest(e.name))} rest</small></span>${complete?`<span class="ok">${svg('check',{w:3.2})}</span>`:`<span class="p">${done}/${all}</span>`}<span class="chev">${svg('chev',{w:2.2})}</span></button>`;
  if(!open)return `<div class="ex">${head}</div>`;
  const rows=s.sets.map((x,k)=>`<div class="setrow"><div class="sn">${k+1}</div><input data-e="${esc(e.id)}" data-s="${k}" data-k="w" inputmode="decimal" autocomplete="off" aria-label="Set ${k+1} weight in ${data.unit}" placeholder="${esc(topW||'—')}" value="${esc(x.w)}"><input data-e="${esc(e.id)}" data-s="${k}" data-k="r" inputmode="numeric" autocomplete="off" aria-label="Set ${k+1} reps" placeholder="${esc(repHint)}" value="${esc(x.r)}"><button class="chk ${x.done?'on':''}" aria-pressed="${!!x.done}" aria-label="Mark set ${k+1} done" onclick="toggleSet('${e.id}',${k})">${svg('check',{w:3})}</button></div>`).join('');
  return `<div class="ex open">${head}<div class="exb">
    <div class="field-help" style="margin:0">${lastPerformance(e.name)}</div>${sug?`<div class="tag">${esc(sug)}</div>`:''}
    <div class="setrow hd"><div></div><div>Weight (${esc(data.unit)})</div><div>Reps</div><div></div></div>${rows}
    <div class="exmeta"><div><label>RIR</label><input data-e="${esc(e.id)}" data-k="rir" type="number" inputmode="numeric" min="0" max="10" placeholder="3" value="${esc(s.rir)}"></div><div><label>Pain / notes</label><input data-e="${esc(e.id)}" data-k="notes" placeholder="Optional" value="${esc(s.notes)}"></div></div>
    <div class="actions"><button class="secondary small" onclick="addSet('${e.id}')">+ Set</button><button class="secondary small" onclick="editExercise(${i})">Edit</button><button class="danger small" onclick="removeExercise(${i})">Remove</button></div></div></div>`;
}
function workoutsView(){
  const d=curDay();
  const open=session._open===undefined?(d.exercises[0]&&d.exercises[0].id):session._open;
  let tot=0,dn=0;d.exercises.forEach(e=>{const s=sess(e);tot+=s.sets.length;dn+=s.sets.filter(x=>x.done).length});

function toggleOpen(id){const d=curDay();const cur=session._open===undefined?(d.exercises[0]&&d.exercises[0].id):session._open;session._open=cur===id?'':id;render()}
function toggleSet(id,k){
  const e=findEx(id);if(!e)return;const s=sess(e),set=s.sets[k];if(!set)return;
  set.done=!set.done;saveDraft();
  if(set.done)startRest(id);
  render();
}
function addSet(id){const e=findEx(id);if(!e)return;sess(e).sets.push({w:'',r:'',done:false});saveDraft();render()}
function editExercise(i){
  const e=curDay().exercises[i];if(!e)return;
  openForm('Edit exercise',[{k:'name',label:'Exercise name',value:e.name},{k:'sets',label:'Working sets',type:'number',value:e.sets},{k:'reps',label:'Rep range / duration',value:e.reps},{k:'rest',label:'Rest (seconds)',type:'number',value:e.rest}],v=>{
    const name=v.name.trim();if(!name){toast('Enter an exercise name');return false}
    e.name=name;e.sets=Math.max(1,Math.min(15,Number(v.sets)||e.sets));e.reps=v.reps.trim()||e.reps;e.rest=Math.max(0,Number(v.rest)||0);
    save();render();
  });
}
function addExercise(){
  openForm('New exercise',[{k:'name',label:'Exercise name',placeholder:'e.g. Cable fly'}],v=>{
    const n=v.name.trim();if(!n){toast('Enter an exercise name');return false}
    curDay().exercises.push({id:uid(),name:n,sets:3,reps:'8–12',rest:defaultRest(n)});save();render();
  },'Add');
}
function removeExercise(i){
  askConfirm('Remove this exercise from the template? Past workout history is kept.',()=>{curDay().exercises.splice(i,1);save();render()},'Remove');
}
function logSession(){
  const d=curDay(),entries=[],prs=[];
  d.exercises.forEach(e=>{
    const s=session[e.id];if(!s)return;
    const sets=s.sets.filter(x=>String(x.w||'').trim()||String(x.r||'').trim()||x.done).map(x=>({w:String(x.w||'').trim(),r:String(x.r||'').trim()}));
    const rir=String(s.rir||'').trim(),notes=String(s.notes||'').trim();
    if(!sets.length&&!notes&&!rir)return;
    const nums=sets.map(x=>numw(x.w)).filter(Number.isFinite);
    const top=nums.length?num2(Math.max(...nums)):((sets.find(x=>x.w)||{}).w||'');
    const entry={exercise:e.name,weight:top,reps:sets.map(x=>x.r||'—').join(', '),rir,notes,sets,unit:data.unit};
    const prior=bestE1rm(e.name),now=Math.max(0,...entrySets(entry).map(e1rm));
    if(prior>0&&now>prior+0.01){entry.pr=true;prs.push(e.name)}
    entries.push(entry);
  });
  if(!entries.length){toast('Enter at least one set first.');return}
  data.logs.push({id:uid(),date:session._date||today(),day:d.name,notes:session._note||'',entries});
  d.exercises.forEach(e=>delete session[e.id]);
  delete session._note;delete session._date;delete session._open;
  if(Object.keys(session).some(k=>!k.startsWith('_')))saveDraft();else clearDraft();
  save();dismissRest();
  openSheet('Workout saved',`<p>${entries.length} exercise${entries.length===1?'':'s'} logged.</p>${prs.length?`<p><span class="badge" style="margin-left:0">NEW PR</span> ${prs.map(esc).join(', ')}</p>`:''}`,`<button onclick="closeSheet();setTab('history')">View history</button>`);
  render();
}

let groceryMonth=new Date().toLocaleDateString('en-CA').slice(0,7);
const money=v=>'$'+Number(v||0).toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2});
function gstate(){const g=data.grocery;g.items||=[];g.purchases||=[];g.pantry||=[];g.monthlyBudgets||={};return g}
function gbudget(g){return Object.prototype.hasOwnProperty.call(g.monthlyBudgets,groceryMonth)?Number(g.monthlyBudgets[groceryMonth]):Number(g.monthlyBudget||0)}
function gmonth(n){const [y,m]=groceryMonth.split('-').map(Number),d=new Date(y,m-1+n,1);groceryMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render()}
function groceryView(){
  const g=gstate(),b=gbudget(g),spent=g.purchases.filter(x=>x.date?.slice(0,7)===groceryMonth).reduce((v,x)=>v+Number(x.amount||0),0);
  const planned=g.items.filter(x=>x.active!==false&&!x.bought&&!x.inPantry).reduce((v,x)=>v+Number(x.qty||0)*Number(x.price||0),0);
  const available=b-spent-planned,pct=b>0?Math.min(100,(spent+planned)/b*100):100;
  const monthLabel=new Date(Number(groceryMonth.slice(0,4)),Number(groceryMonth.slice(5,7))-1,1).toLocaleDateString('en-CA',{month:'long',year:'numeric'});
  const items=g.items.map(x=>`<div class="history gitem"><button class="chk ${x.bought?'on':''}" aria-pressed="${!!x.bought}" aria-label="${x.bought?'Mark not bought':'Mark bought'}: ${esc(x.name)}" onclick="gToggle('${x.id}','bought')">${svg('check',{w:3})}</button><div style="flex:1;min-width:0"><strong>${esc(x.name)}</strong><div class="muted small">${esc(x.qty)} ${esc(x.unit||'units')} × ${money(x.price)} = ${money(Number(x.qty)*Number(x.price))}</div><div class="muted small">${x.inPantry?'Already in pantry':x.bought?'Marked bought':x.active===false?'Not in current plan':'Planned'}</div></div><details class="menu"><summary aria-label="Options for ${esc(x.name)}">${svg('more')}</summary><div class="pop"><button class="secondary small" onclick="gEditItem('${x.id}')">Edit</button><button class="secondary small" onclick="gToggle('${x.id}','active')">${x.active===false?'Include':'Skip'}</button><button class="secondary small" onclick="gToggle('${x.id}','inPantry')">${x.inPantry?'Need it':'In pantry'}</button><button class="danger small" onclick="gRemoveItem('${x.id}')">Remove</button></div></details></div>`).join('');
  return card('Monthly grocery budget',`<div class="row"><div class="actions" style="align-items:center"><button class="secondary small" aria-label="Previous month" onclick="gmonth(-1)">${svg('left')}</button><b style="font-family:var(--display);font-size:20px;letter-spacing:.04em;text-transform:uppercase">${esc(monthLabel)}</b><button class="secondary small" aria-label="Next month" onclick="gmonth(1)">${svg('right')}</button></div></div><p class="muted small">Plan purchases, track receipts and keep a separate pantry list. Amounts are CAD.</p><div class="formgrid"><div><label>Budget for ${esc(monthLabel)} (CAD)</label><input type="number" inputmode="decimal" min="0" step=".01" id="gBudget" value="${b.toFixed(2)}"></div><div style="align-self:end"><button onclick="gSaveBudget()">Save budget</button></div></div><div class="grid" style="margin-top:16px"><div><div class="eyebrow">Budget</div><div class="metric">${money(b)}</div></div><div><div class="eyebrow">Spent</div><div class="metric">${money(spent)}</div></div><div><div class="eyebrow">Planned</div><div class="metric">${money(planned)}</div></div><div><div class="eyebrow">Left after plan</div><div class="metric" style="color:${available<0?'var(--danger)':'var(--accent)'}">${money(available)}</div></div></div><div class="bar ${available<0?'over':''}" style="margin-top:14px"><div style="width:${pct}%"></div></div><p class="muted small">Left after plan = monthly budget − recorded purchases − planned items.</p>`)
  +card('Shopping list',`<p class="muted small">Ticking an item removes it from the planned total. Record the actual receipt below to count what you really spent.</p>${items||'<div class="empty">Your shopping list is empty. Add your first grocery below.</div>'}<div class="formgrid" style="margin-top:14px"><div><label>Grocery item</label><input id="gName" placeholder="e.g. Chicken thighs"></div><div><label>Quantity</label><input id="gQty" type="number" inputmode="decimal" min=".01" step=".01" value="1"></div><div><label>Unit</label><input id="gUnit" placeholder="kg, dozen, tub, bag" value="item"></div><div><label>Price per unit (CAD)</label><input id="gPrice" type="number" inputmode="decimal" min="0" step=".01" placeholder="12.99"></div></div><div class="spacer"></div><button onclick="gAddItem()">+ Add grocery</button>`)
  +card('Record actual grocery spending',`<div class="formgrid"><div><label>Purchase date</label><input type="date" id="gDate" value="${today()}"></div><div><label>Store or note</label><input id="gStore" placeholder="e.g. Loblaws"></div><div><label>Receipt total (CAD)</label><input type="number" inputmode="decimal" id="gAmount" min=".01" step=".01" placeholder="48.90"></div></div><div class="spacer"></div><button onclick="gAddPurchase()">Save purchase</button><p class="muted small">Enter the total paid once per shopping trip. Ticking an item does not create a purchase, which prevents double-counting.</p>${g.purchases.filter(x=>x.date?.slice(0,7)===groceryMonth).slice().reverse().map(x=>`<div class="history row"><div><strong>${money(x.amount)}</strong> · ${esc(x.date)}<div class="muted small">${esc(x.store||'Grocery purchase')}</div></div>${delBtn(`gRemovePurchase('${x.id}')`)}</div>`).join('')||'<div class="empty">No purchases recorded for this month.</div>'}`);
}
function gSaveBudget(){const v=Number($('#gBudget').value);if(!Number.isFinite(v)||v<0){toast('Enter a valid monthly budget.');return}gstate().monthlyBudgets[groceryMonth]=v;save();render();toast('Budget saved')}
function gAddItem(){
  const name=$('#gName').value.trim(),qty=Number($('#gQty').value),price=Number($('#gPrice').value),unit=$('#gUnit').value.trim()||'item';
  if(!name||!Number.isFinite(qty)||qty<=0||!Number.isFinite(price)||price<0){toast('Enter an item, positive quantity and valid price.');return}
  gstate().items.push({id:uid(),name,qty,price,unit,active:true,bought:false,inPantry:false});save();render();
}
function gEditItem(id){
  const x=gstate().items.find(x=>x.id===id);if(!x)return;
  openForm('Edit item',[{k:'name',label:'Item name',value:x.name},{k:'qty',label:'Quantity',type:'number',value:x.qty},{k:'price',label:'Price per unit (CAD)',type:'number',value:x.price},{k:'unit',label:'Unit',value:x.unit||'item'}],v=>{
    if(!v.name.trim()||!Number.isFinite(Number(v.qty))||Number(v.qty)<=0||!Number.isFinite(Number(v.price))||Number(v.price)<0){toast('Invalid item values.');return false}
    Object.assign(x,{name:v.name.trim(),qty:Number(v.qty),price:Number(v.price),unit:v.unit.trim()||'item'});save();render();
  });
}
function gToggle(id,key){const x=gstate().items.find(x=>x.id===id);if(!x)return;x[key]=!x[key];save();render()}
function gRemoveItem(id){askConfirm('Remove this grocery item?',()=>{gstate().items=gstate().items.filter(x=>x.id!==id);save();render()},'Remove')}
function gAddPurchase(){
  const date=$('#gDate').value,amount=Number($('#gAmount').value),store=$('#gStore').value.trim();
  if(!date||!Number.isFinite(amount)||amount<=0){toast('Enter a valid date and receipt amount.');return}
  gstate().purchases.push({id:uid(),date,amount,store});groceryMonth=date.slice(0,7);save();render();

function gRemovePurchase(id){askConfirm('Delete this purchase record?',()=>{gstate().purchases=gstate().purchases.filter(x=>x.id!==id);save();render()})}

/* ---------- Activity ---------- */
function activityView(){
  const a=data.activity,entries=a.entries.slice().sort((x,y)=>y.date.localeCompare(x.date));
  const week=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-i);return d.toLocaleDateString('en-CA')}).reverse();

  +card('Last 7 days',week.map(d=>{const n=(a.entries.find(x=>x.date===d)||{}).steps||0;return `<div class="history"><div class="row"><b>${esc(d)}</b><span style="font-variant-numeric:tabular-nums">${fmt(n)} steps</span></div><div class="bar" style="margin-top:8px"><div style="width:${Math.min(100,100*n/Math.max(1,a.goal))}%"></div></div></div>`}).join(''))
  +card('Step history',entries.length?entries.map(x=>`<div class="history row"><span>${esc(x.date)} — ${fmt(x.steps)} steps</span>${delBtn(`deleteSteps('${esc(x.date)}')`)}</div>`).join(''):'<p class="muted">No steps logged yet.</p>');
}
function saveStepGoal(){const n=Number($('#stepGoal').value);if(!Number.isInteger(n)||n<1||n>100000){toast('Choose a goal between 1 and 100,000.');return}data.activity.goal=n;save();render();toast('Goal updated')}
function saveSteps(){
  const date=$('#stepDate').value,n=Number($('#stepCount').value);
  if(!date||$('#stepCount').value===''||!Number.isInteger(n)||n<0||n>200000){toast('Enter a valid date and step count.');return}
  data.activity.entries=data.activity.entries.filter(x=>x.date!==date);data.activity.entries.push({date,steps:n});save();render();

function deleteSteps(date){askConfirm('Delete steps for '+date+'?',()=>{data.activity.entries=data.activity.entries.filter(x=>x.date!==date);save();render()})}

const imgTag=(src,alt)=>{const s=imgSrc(src);return s?`<img src="${s}" alt="${esc(alt)}">`:`<div class="empty" style="height:180px;background:var(--panel2);border-radius:10px">Image unavailable</div>`};
function photosView(){
  const P=data.photos;
  return card('Private progress photos',`<p class="muted">Photos stay in this browser (in its image store) unless you export a backup. They are resized to save space, so keep your originals separately. Anyone with access to this browser profile may be able to view them.</p><div class="formgrid"><div><label>Photo date</label><input type="date" id="photoDate" value="${today()}"></div><div><label>Angle</label><select id="photoAngle"><option>Front</option><option>Side</option><option>Back</option><option>Other</option></select></div><div><label>Choose image</label><input type="file" id="photoFile" accept="image/*"></div><div><label>Notes</label><input id="photoNotes" placeholder="Lighting, pose, etc."></div></div><div class="spacer"></div><button onclick="addPhoto()">Save photo</button><p class="field-help">${IMG.ok?'Stored in IndexedDB, so large photo collections are fine.':'Image store unavailable (private browsing?) — photos fall back to regular storage, which is small.'}</p>`)
  +card('Photo gallery',P.length?`<div class="photo-grid">${P.map(x=>`<div class="photo-card">${imgTag(x.src,'Progress photo '+x.angle)}<div class="small" style="margin-top:6px"><b>${esc(x.date)}</b> · ${esc(x.angle)}</div><div class="muted small">${esc(x.notes)}</div><button class="danger small" style="margin-top:6px" onclick="removePhoto('${x.id}')">Delete</button></div>`).join('')}</div>`:'<div class="empty">No photos added.</div>')
  +card('Compare two photos',P.length>=2?`<div class="formgrid"><div><label>Before</label><select id="beforePhoto" onchange="updateCompare()">${P.map((p,i)=>`<option value="${i}">${esc(p.date)} · ${esc(p.angle)}</option>`).join('')}</select></div><div><label>After</label><select id="afterPhoto" onchange="updateCompare()">${P.map((p,i)=>`<option value="${i}" ${i===P.length-1?'selected':''}>${esc(p.date)} · ${esc(p.angle)}</option>`).join('')}</select></div></div><div class="spacer"></div><div class="compare"><img id="beforeImage" src="${imgSrc(P[0].src)}" alt="Before photo"><img id="afterImage" src="${imgSrc(P[P.length-1].src)}" alt="After photo"></div>`:'<div class="empty">Add two photos to compare.</div>');
}
function updateCompare(){$('#beforeImage').src=imgSrc(data.photos[Number($('#beforePhoto').value)].src);$('#afterImage').src=imgSrc(data.photos[Number($('#afterPhoto').value)].src)}
async function addPhoto(){
  const f=$('#photoFile').files[0];
  if(!f||!f.type.startsWith('image/')){toast('Choose an image.');return}
  const date=$('#photoDate').value||today(),angle=$('#photoAngle').value,notes=$('#photoNotes').value;
  try{
    const dataUrl=await resizeImage(f,900,.7),id=uid(),src=await storeImage(id,dataUrl);
    data.photos.push({id,date,angle,notes,src});
    if(!save()){data.photos.pop();forgetImage(src);return}
    render();toast('Photo saved');
  }catch(e){toast('Unable to process this image: '+e.message,4000)}
}
function removePhoto(id){askConfirm('Delete this photo from this device?',()=>{const p=data.photos.find(x=>x.id===id);if(p)forgetImage(p.src);data.photos=data.photos.filter(x=>x.id!==id);save();render()})}

  if(!file||!file.type.startsWith('image/')){toast('Choose a photo first.');return}
  const caption=$('#themeCaption').value.trim()||'My inspiration',section=$('#themeSection').value;
  try{
    const dataUrl=await resizeImage(file,800,.55),id=uid(),src=await storeImage(id,dataUrl);
    data.themeImages.push({id,src,caption,section});
    if(!save()){data.themeImages.pop();forgetImage(src);return}
    render();toast('Photo added');
  }catch(e){toast('Could not add image: '+e.message,4000)}
}
function removeThemePhoto(id){askConfirm('Delete this background photo?',()=>{const p=data.themeImages.find(x=>x.id===id);if(p)forgetImage(p.src);data.themeImages=data.themeImages.filter(x=>x.id!==id);save();render()})}
function assignThemePhoto(id){
  const p=data.themeImages.find(x=>x.id===id);if(!p)return;
  openForm('Assign photo to section',[{k:'s',label:p.caption,type:'select',value:p.section,options:[...THEME_SECTIONS.map(k=>[k,THEME_LABELS[k]]),['all','All sections (fallback)']]}],v=>{p.section=v.s;save();render()});
}

/* ---------- Settings & More ---------- */
function moreView(){
  const row=(t,l,sub)=>`<button class="moreitem" onclick="setTab('${t}')"><span>${l}<span class="muted small" style="display:block;font-weight:400">${sub}</span></span>${svg('right')}</button>`;
  return card('More',`${row('journal','Journal','Training reflections and goals')}${row('ideas','Ideas','Upgrade roadmap')}${row('inspire','Inspire','Quotes and image board')}${row('theme','Themes','Accent colour and photos')}${row('settings','Settings','Units, backup and data')}`);
}
function settingsView(){
  return moreBack()
  +(recovered?`<div class="card" style="border-color:var(--warn)"><h3>Saved data was damaged</h3><p class="muted small" style="margin:0">On startup the stored data could not be read, so a raw copy was kept in this browser under a key starting with <code>${esc(KEY)}_corrupt_</code> and the app started fresh. If you have a JSON backup, import it below.</p></div>`:'')
  +card('Preferences',`<div class="formgrid"><div><label>Lifting units</label><select id="unitSel" onchange="data.unit=this.value;save();toast('Units updated')"><option value="kg" ${data.unit==='kg'?'selected':''}>Kilograms (kg)</option><option value="lb" ${data.unit==='lb'?'selected':''}>Pounds (lb)</option></select></div><div><label>Rest-over sound</label><select onchange="data.sound=this.value==='on';save();if(data.sound){unlockAudio();beep()}"><option value="on" ${data.sound!==false?'selected':''}>On</option><option value="off" ${data.sound===false?'selected':''}>Off</option></select></div></div><p class="field-help">Sound needs your phone's ringer on. The timer also flashes and vibrates where the browser allows it (iPhone Safari does not vibrate).</p>`)
  +card('Data protection',`<p>Entries are saved in <strong>this browser's localStorage</strong> on this device; photos are kept in its IndexedDB image store. Nothing is uploaded or synced. Private browsing, clearing site data or changing devices can erase or hide your records, and opening this file from a different location or address creates a separate storage area.</p><div class="actions"><button class="secondary" onclick="askPersist()">Request persistent storage</button></div><p class="muted small">Cloud sync is not connected, and browsers cannot read Apple Health directly. Keep exporting backups until that changes.</p>`)
  +card('Backup and restore',`<div class="actions"><button onclick="exportData()">Download JSON backup</button><button class="secondary" onclick="$('#importFile').click()">Import backup</button><input id="importFile" type="file" accept="application/json,.json" class="hidden" onchange="importData(event)"></div><p class="muted small">Backups include photos, so they can be large. Import replaces the current data after confirmation.</p>`)
  +card('Your program',`<p class="muted">Change workout templates from the Workouts tab. Completed sessions are kept separately from templates.</p><div class="formgrid">${data.program.map((p,i)=>`<div><label>Workout ${i+1} name</label><input id="dayname${i}" value="${esc(p.name)}"></div>`).join('')}</div><div class="spacer"></div><button onclick="saveDayNames()">Save workout names</button>`)
  +card('Other notes',`<label>Goals, appointments, recovery reminders</label><textarea id="generalNotes" rows="5">${esc(data.notes||'')}</textarea><div class="spacer"></div><button onclick="data.notes=$('#generalNotes').value;save();toast('Notes saved')">Save notes</button>`)
  +card('Reset',`<p class="muted">Permanently removes workouts, measurements, nutrition logs and photos from this browser. Export first.</p><button class="danger" onclick="resetAll()">Reset all local data</button>`);
}
async function askPersist(){
  try{
    if(!navigator.storage||!navigator.storage.persist){toast('Not supported in this browser');return}
    const ok=await navigator.storage.persist();toast(ok?'Persistent storage granted':'The browser declined — keep exporting backups');
  }catch(e){toast('Could not request persistent storage')}
}
function saveDayNames(){data.program.forEach((p,i)=>p.name=$('#dayname'+i).value.trim()||p.name);save();render();toast('Names saved')}

/* ---------- boot ---------- */
async function boot(){
  loadData();save();loadDraft();buildTabbar();
  const h=(location.hash||'').slice(1);tab=TABS.includes(h)?h:'home';
  render();booted=true;
  if(recovered)toast('Saved data looked damaged. A copy was kept and the app started fresh — see Settings.',7000);
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  await idbOpen();
  if(IMG.ok){await idbLoadAll();await migrateImages()}
  applyTheme();
  if(tab==='photos'||tab==='theme')render();
}
boot().catch(showFatal);


</script>
</body></html>
